name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # apps/web validates these at startup (src/env.ts). The binder viewer
      # test now seeds and queries real rows, so DATABASE_URL points at the
      # Postgres service above; S3/auth stay placeholders since nothing here
      # exercises them.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      PUBLIC_ASSETS_URL: http://localhost:9000/ci
      BETTER_AUTH_SECRET: ci-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      # e2e signs in through the dev-only email+password login (never on in
      # production builds); see apps/web/e2e/global-setup.ts.
      AUTH_DEV_LOGIN: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Migrate the database
        run: pnpm --filter @sleevebook/db db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @sleevebook/web exec playwright install --with-deps chromium

      - run: pnpm test
