name: Catalog ingest

on:
  schedule:
    # Daily catalog sync from the pokemon-tcg-data dump (sets, cards, variants).
    # The dump carries no prices; prices come from the separate prices job
    # (.github/workflows/prices.yml).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sleevebook/ingest start
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
