name: Prices

on:
  schedule:
    # Daily market prices (pokemontcg.io / tcgplayer) and USD exchange rates,
    # for the variants referenced by binders and goals only.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sleevebook/ingest prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}

      # Copies the pokemontcg.io images of referenced variants to our R2 bucket
      # (at most 500 per day). Runs after the prices step: if prices fail, the job
      # stops there and this step waits for the next daily run.
      # Skipped (not failed) until the R2 secrets exist in GitHub Actions
      # (docs/DEPLOY.md §8). Secrets can't be read in `if:`, so check them
      # in the shell.
      - name: Copy referenced card images to R2
        run: |
          if [ -z "$S3_ENDPOINT" ] || [ -z "$S3_BUCKET" ]; then
            echo "::notice::R2 secrets not configured; skipping image copy"
            exit 0
          fi
          pnpm --filter @sleevebook/ingest images --cap 500
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          PUBLIC_ASSETS_URL: ${{ secrets.PUBLIC_ASSETS_URL }}
