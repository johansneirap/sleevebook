name: Prices

on:
  schedule:
    # Daily market prices (pokemontcg.io / tcgplayer) and USD exchange rates,
    # for the variants referenced by binders and goals only.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sleevebook/ingest prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
